name: Docker Image

on:
  push:
    branches: [ main ]
    paths:
      - 'backend/src/**'
      - 'backend/build.gradle'
      - 'backend/gradle.properties'
      - 'backend/gradle/**'
      - 'backend/docker-compose.yml'
      - '.github/workflows/docker-publish.yml'
    tags:
      - 'v*'
  pull_request:
    paths:
      - 'backend/src/**'
      - 'backend/build.gradle'
      - 'backend/gradle.properties'
      - 'backend/gradle/**'
      - 'backend/docker-compose.yml'
      - '.github/workflows/docker-publish.yml'
  workflow_dispatch:

#* GHCR 推送仅依赖 Actions 内置 GITHUB_TOKEN, 无需配置任何额外 Secret.
permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    #* monorepo 重组后 Gradle 工程位于 backend/, job 内全部 run 步骤统一切换工作目录.
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build (skip tests, ci.yml already verified)
        run: ./gradlew build -x test --console=plain

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      #? metadata-action 会自动将镜像名统一为小写, tag 规则: main -> main/latest/sha, tag -> 版本号/sha.
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/src/main/docker/Dockerfile.jvm
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
