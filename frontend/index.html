<!doctype html>
<html lang="zh-CN" data-theme="sage" data-mode="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- favicon 用 data-URI 内联 SVG (零额外请求): 草木意象贴合"心灵札记"; text 基线 y=.9em 把 emoji 顶进 viewBox 视口. -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌿</text></svg>" />
    <!-- 声明支持亮暗双档: 具体档位由 tokens.css 按 <html data-mode> 收敛 (外观可手动覆盖, 不再直接跟随系统), 此处只声明范围. -->
    <meta name="color-scheme" content="light dark" />
    <title>心灵札记</title>
    <script>
      //? 防 FOUC 早脚本: 首帧绘制前读 localStorage 的主题+外观, 改写 <html data-theme data-mode> (tokens.css 按属性对挂载色板);
      //? 键名/名单/回退与 src/utils/theme.ts 完全一致 (主题缺失/非法保持雾杉, 模式缺失/非法按 matchMedia 解析), try/catch 兜隐私模式禁写;
      //? 档位解析失败 (无 matchMedia 的老旧环境) 兜浅色, 与 html 标签上的静态缺省一致, 脚本任何分支都不得让 data-mode 缺失.
      (function ()
      {
        var root = document.documentElement;
        var t, m, dark = false;
        try { t = localStorage.getItem('soul.theme'); } catch (e) { t = null; }
        try { m = localStorage.getItem('soul.mode'); } catch (e) { m = null; }
        try { dark = window.matchMedia('(prefers-color-scheme: dark)').matches; } catch (e) { dark = false; }
        if (t === 'sage' || t === 'dusk') root.setAttribute('data-theme', t);
        root.setAttribute('data-mode', m === 'light' || m === 'dark' ? m : (dark ? 'dark' : 'light'));
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
