#* 测试配置: 禁用 Hibernate 和 DevServices, 避免在无 Docker 环境启动 PostgreSQL.
quarkus.hibernate-orm.active=false
quarkus.datasource.active=false
quarkus.devservices.enabled=false

#* SmallRye JWT 需要运行时配置, 在测试环境中提供测试密钥.
jwt.secret=test-jwt-secret-key-for-unit-tests-only

#* Redis 配置: 设置虚拟地址使 Redis Bean 激活 (测试不实际使用 Redis).
quarkus.redis.hosts=redis://localhost:6379

#* 测试期静音预期内的"脏数据回退"warn: 由容错单元测试刻意触发 (伪造/损坏 token 回退哈希, 非法 messages JSON 容错),
#* 断言的是回退行为本身; quarkus-junit-config 的 LoggingSetupExtension 会在纯 JUnit 测试中应用本配置, 生产环境不受影响.
quarkus.log.category."kurvcygnus.soulnotes.domain.auth.service.TokenService".level=ERROR
quarkus.log.category."kurvcygnus.soulnotes.domain.chat.service.ChatService".level=ERROR
#* 扩展通知调度器测试域全局关闸 (ext.notify.tick-seconds<=0 即不注册周期任务): 默认 profile 的集成测试
#* (不经 MockLlmProfile 的少数测试) 同样不得让真实 60s 计时器在测试窗口消费幂等键 — MockLlmProfile 的
#* 同名 override 保留 (双保险, 谁先谁后都归零).
ext.notify.tick-seconds=0
