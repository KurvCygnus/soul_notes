#* ============================================================
#* Soul Notes Backend — Application Configuration
#* ============================================================

#* ---- Datasource ----
quarkus.datasource.db-kind = postgresql
quarkus.datasource.username = ${USER_NAME}
quarkus.datasource.password = ${USER_PASSWORD}
quarkus.datasource.reactive.url = ${URL:postgresql://localhost:5432/soulnotes}

#* ---- Redis ----
quarkus.redis.hosts = redis://localhost:6379

#* ---- JWT ----
#* 生产环境必须通过 HASH_KEY 环境变量注入签名密钥 (至少 32 字节).
#* 未配置时 TokenService 会在启动时 fail-fast, 避免静默使用弱密钥.
jwt.secret = ${HASH_KEY:}
jwt.ttl-seconds = 604800

#* 预期 issuer 必须与 TokenService 签发的 iss (JwtConstants.ISSUER="soul-notes") 一致,
#* 否则 smallrye-jwt 会使用默认 issuer (https://quarkus.io/issuer) 导致所有 Token 验签失败.
mp.jwt.verify.issuer = soul-notes

#* ---- CORS ----
quarkus.http.cors.enabled = true
quarkus.http.cors.origins = ${ORIGINS:http://localhost:5173}
quarkus.http.cors.methods = GET,POST,PUT,DELETE,OPTIONS
quarkus.http.cors.headers = accept,authorization,content-type

#* ---- AI (Phase 2 placeholder) ----
ai.openai.api-key=placeholder
ai.openai.endpoint=https://api.openai.com/v1
ai.openai.model-name=gpt-4o-mini

#* LangChain4j native config
quarkus.langchain4j.openai.api-key=${ai.openai.api-key}
quarkus.langchain4j.openai.base-url=${ai.openai.endpoint}
quarkus.langchain4j.openai.chat-model.model-name=${ai.openai.model-name}
quarkus.langchain4j.openai.chat-model.temperature=0.7
quarkus.langchain4j.openai.chat-model.max-completion-tokens=1024
quarkus.langchain4j.openai.timeout=30s
quarkus.langchain4j.openai.log-requests=false
quarkus.langchain4j.openai.log-responses=false

#* ---- Crisis Hotline ----
crisis.hotline.primary = ${CRISIS_HOTLINE_PRIMARY:400-161-9995}
crisis.hotline.backup = ${CRISIS_HOTLINE_BACKUP:12355}
crisis.hotline.name = ${CRISIS_HOTLINE_NAME:全国心理援助热线}

#* ---- Voice Storage ----
voice.storage.directory = ${VOICE_STORAGE_DIR:voice_uploads}
voice.storage.max-size = 10485760

#* ---- Emotion Weather Thresholds ----
#* 情绪天气预报映射阈值, 边界语义统一为 >=.
weather.threshold.storm = 0.8
weather.threshold.rainy = 0.6
weather.threshold.overcast = 0.4
weather.threshold.sunny = 0.6
