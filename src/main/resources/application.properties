# ============================================================
# Soul Notes Backend — Application Configuration
# ============================================================

# ---- Datasource ----
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=soulnotes
quarkus.datasource.password=soulnotes
quarkus.datasource.reactive.url=postgresql://localhost:5432/soulnotes
quarkus.hibernate-orm.database.generation=none

# ---- Redis ----
quarkus.redis.hosts=redis://localhost:6379

# ---- JWT ----
jwt.secret=soul-notes-dev-secret-key-min-256-bits-long
jwt.ttl-seconds=604800

# ---- CORS ----
quarkus.http.cors=true
quarkus.http.cors.origins=http://localhost:5173
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS
quarkus.http.cors.headers=accept,authorization,content-type

# ---- AI (Phase 2 placeholder) ----
ai.openai.api-key=placeholder
ai.openai.endpoint=https://api.openai.com/v1
