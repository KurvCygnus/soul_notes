#* ============================================================
#* Soul Notes Backend — Application Configuration
#* ============================================================

#* ---- Datasource ----
quarkus.datasource.db-kind = postgresql
quarkus.datasource.username = ${USER_NAME:}
quarkus.datasource.password = ${USER_PASSWORD:}
quarkus.datasource.reactive.url = ${URL:postgresql://localhost:5432/soulnotes}

#* ---- Redis ----
quarkus.redis.hosts = redis://localhost:6379

#* ---- JWT ----
jwt.secret = ${HASH_KEY:0a97621d0d219466778f5b41d1a520fd98b8cb5b738d452bde26f3398d9e1a42f809783d5f04a05a2fb33c00eb88037aa9d60465818b2a2c6be38665330529a3}
jwt.ttl-seconds = 604800

#* ---- CORS ----
quarkus.http.cors.enabled = true
quarkus.http.cors.origins = ${ORIGINS:http://localhost:5173}
quarkus.http.cors.methods = GET,POST,PUT,DELETE,OPTIONS
quarkus.http.cors.headers = accept,authorization,content-type

#* ---- AI (Phase 2 placeholder) ----
ai.openai.api-key=placeholder
ai.openai.endpoint=https://api.openai.com/v1
ai.openai.model-name=gpt-4o-mini

#* LangChain4j native config
quarkus.langchain4j.openai.api-key=${ai.openai.api-key}
quarkus.langchain4j.openai.base-url=${ai.openai.endpoint}
quarkus.langchain4j.openai.chat-model.model-name=${ai.openai.model-name}
quarkus.langchain4j.openai.chat-model.temperature=0.7
quarkus.langchain4j.openai.chat-model.max-tokens=1024
quarkus.langchain4j.openai.chat-model.timeout=30s
quarkus.langchain4j.openai.log-requests=false
quarkus.langchain4j.openai.log-responses=false
