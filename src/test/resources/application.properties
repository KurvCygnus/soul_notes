#* 测试配置: 禁用 Hibernate 和 DevServices, 避免在无 Docker 环境启动 PostgreSQL.
quarkus.hibernate-orm.active=false
quarkus.datasource.active=false
quarkus.devservices.enabled=false

#* SmallRye JWT 需要运行时配置, 在测试环境中提供测试密钥.
jwt.secret=test-jwt-secret-key-for-unit-tests-only

#* Redis 配置: 设置虚拟地址使 Redis Bean 激活 (ExampleResourceTest 不实际使用 Redis).
quarkus.redis.hosts=redis://localhost:6379